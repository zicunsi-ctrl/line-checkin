<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動現場簽到系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #f5f6fa;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .logo {
            width: 80px;
            height: 80px;
            background-color: #2ecc71;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.3);
        }
        h2 {
            margin: 0 0 10px;
            color: #2c3e50;
            font-size: 22px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus {
            border-color: #2ecc71;
        }
        .user-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        .user-name {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.98);
            background-color: #27ae60;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        /* 成功畫面特有樣式 */
        .success-bg {
            background-color: #2ecc71 !important;
            color: white !important;
        }
        .success-bg h2, .success-bg p {
            color: white !important;
        }
        .success-logo {
            background-color: white !important;
            color: #2ecc71 !important;
            font-size: 40px;
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="logo" id="main-logo">✓</div>
    <h2 id="main-title">活動無紙化簽到</h2>
    <p id="status-text">正在讀取您的 LINE 帳號安全資訊...</p>
    
    <div id="info-box" style="display:none;">
        <div class="user-box">
            <span style="font-size: 11px; color: #95a5a6;">LINE 帳號暱稱：</span>
            <span id="line-nickname" class="user-name">載入中...</span>
        </div>
        
        <div class="form-group">
            <label for="realname">請輸入您的真實姓名 <span style="color:red;">*</span></label>
            <input type="text" id="realname" placeholder="請輸入姓名" required>
        </div>
        
        <button id="btn-checkin" onclick="submitCheckIn()">確認報到</button>
    </div>
</div>

<script>
    // ================== 請在此填入您的參數 ==================
    const MY_LIFF_ID = '2010478658-O73tZEw3'; // 您的 LINE Login LIFF ID
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzfDWHtHkMMxHZCHDEqJeS9nu5noX8Q2WLMNqougsBlZ9pmFB3_Acd5mOtlSUhRHJJQrA/exec'; // 部署好的 Google Apps Script 網址
    // =======================================================

    let userProfile = {};

    // 1. 初始化 LINE LIFF SDK
    async function initLiff() {
        try {
            await liff.init({ liffId: MY_LIFF_ID });
            if (liff.isLoggedIn()) {
                // 已登入：取得使用者 LINE Profile 資料
                userProfile = await liff.getProfile();
                document.getElementById('line-nickname').innerText = userProfile.displayName;
                
                // 自動把 LINE 暱稱帶入真實姓名框中，方便民眾修改
                document.getElementById('realname').value = userProfile.displayName;
                
                document.getElementById('status-text').innerText = '請確認您的姓名，並點選下方按鈕完成簽到。';
                document.getElementById('info-box').style.display = 'block';
            } else {
                liff.login();
            }
        } catch (error) {
            document.getElementById('status-text').innerText = '系統讀取失敗，請在 LINE 軟體內開啟此連結。';
            console.error('LIFF 初始化失敗:', error);
        }
    }

    // 2. 送出簽到資料
    async function submitCheckin() {
  const displayName = document.getElementById('display-name').value.trim();
  const email = document.getElementById('user-email').value.trim();
  const userId = document.getElementById('user-id').value;
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status-text');

  if (!displayName) {
    alert('請確認 LINE 暱稱！');
    return;
  }
  if (!email) {
    alert('請輸入 Email 信箱！');
    return;
  }

  btn.disabled = true;
  btn.innerText = '處理中...';
  status.innerText = '正在核對簽到記錄...';

  try {
    const response = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify({
        displayName: displayName,
        email: email,
        userId: userId
      })
    });
    
    const result = await response.json();
    
    if (result.status === 'duplicate') {
      alert(result.message); // 跳出提示：您先前已經完成過報到囉！
      btn.disabled = false;
      btn.innerText = '確認報到';
      status.innerText = '此帳號已報到過。';
      return;
    }
    
    // 首次簽到成功
    document.getElementById('form-state').style.display = 'none';
    document.getElementById('success-state').style.display = 'block';
    status.innerText = '';
  } catch (error) {
    alert('簽到失敗，請重試！');
    btn.disabled = false;
    btn.innerText = '確認報到';
    status.innerText = '寫入失敗，請洽現場工作人員。';
  }
}

    // 3. 轉化為成功簽到畫面的函式
    function showSuccessScreen(name) {
        const card = document.getElementById('main-card');
        const logo = document.getElementById('main-logo');
        const title = document.getElementById('main-title');
        const statusText = document.getElementById('status-text');
        const infoBox = document.getElementById('info-box');

        // 隱藏輸入表單與按鈕
        infoBox.style.display = 'none';

        // 改變卡片顏色為精美滿版綠色，給予視覺回饋
        card.classList.add('success-bg');
        logo.classList.add('success-logo');
        logo.innerHTML = '✓';

        // 更改文字提示為大字體的成功資訊
        title.innerHTML = '報到成功！';
        
        // 取得當前時間
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        
        statusText.innerHTML = `
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">${name} 貴賓您好</div>
            <p style="font-size: 15px; line-height: 1.6;">
                您已於 <strong>${timeStr}</strong> 成功完成簽到！<br>
                並且已加入<strong>【鹿谷鄉公所】</strong>官方帳號好友。<br><br>
                請向現場工作人員出示此畫面引導進場。<br>
                祝您今天活動愉快！
            </p>
            <div style="margin-top: 25px;">
                <button onclick="liff.closeWindow()" style="background-color: white; color: #2ecc71; border: 1px solid white;">關閉視窗</button>
            </div>
        `;
    }

    // 啟動執行
    initLiff();
</script>
</body>
</html>
