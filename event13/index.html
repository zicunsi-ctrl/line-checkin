<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會議室簽到</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; background: #f0f2f5; }
    .card { background: #fff; width: 88%; max-width: 360px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; margin-bottom: 12px; }
    h2 { margin: 8px 0; font-size: 20px; color: #1c1e21; }
    p { color: #606770; font-size: 14px; margin-top: 4px; }
    .btn { width: 100%; padding: 14px; background: #06C755; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    .btn:disabled { background: #bcc0c4; cursor: not-allowed; }
    #statusMsg { margin-top: 16px; font-size: 14px; font-weight: 500; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">載入 LINE 帳號資料中...</div>
    <div id="userArea" style="display:none;">
      <img id="userPicture" class="avatar" src="" alt="">
      <h2 id="userName"></h2>
      <p>請確認已連上會議室 Wi-Fi 後點擊下方按鈕</p>
      <button id="checkinBtn" class="btn" onclick="submitCheckin()">立即簽到</button>
    </div>
    <div id="statusMsg"></div>
  </div>

  <script>
    // === 請替換以下兩個設定值 ===
    const MY_LIFF_ID = "2010478658-NJjo0PXT"; 
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpIaRzFVuvZsi8UXIvShw4KKwGpMTLgRfqKL3NE__Ry3tsmmE28lsS4_LzVmE1j_nzGg/exec"; 
    // ===========================

    let userProfile = null;

    async function main() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        userProfile = await liff.getProfile();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('userArea').style.display = 'block';
        document.getElementById('userName').innerText = userProfile.displayName;
        if (userProfile.pictureUrl) {
          document.getElementById('userPicture').src = userProfile.pictureUrl;
        }
      } catch (err) {
        document.getElementById('loading').innerText = "LINE 連線失敗，請重新整理頁面。";
      }
    }

    async function submitCheckin() {
      const btn = document.getElementById('checkinBtn');
      const status = document.getElementById('statusMsg');
      btn.disabled = true;
      status.style.color = "#1877f2";
      status.innerText = "驗證現場網路環境中...";

      try {
        // 1. 抓取目前手機對外 IP
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();

        // 2. 送出至 Google Apps Script
        status.innerText = "登記簽到名單中...";
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            lineName: userProfile.displayName,
            lineUserId: userProfile.userId,
            clientIP: ipData.ip
          })
        });

        const result = await res.json();
        if (result.success) {
          status.style.color = "#06C755";
          status.innerText = " 簽到成功！視窗即將關閉...";
          setTimeout(() => liff.closeWindow(), 2000);
        } else {
          status.style.color = "#fa3e3e";
          status.innerText = "❌ " + result.message;
          btn.disabled = false;
        }
      } catch (e) {
        status.style.color = "#fa3e3e";
        status.innerText = "❌ 連線異常，請確認網路後重試";
        btn.disabled = false;
      }
    }

    main();
  </script>
</body>
</html>
